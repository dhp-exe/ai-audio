[project]
name = "ai-audio"
version = "0.2.0"
description = "Audio-first Vietnamese AI micro-drama production pipeline with fixed Virtual Actor voice IPs"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0",
    "elevenlabs>=2.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "rich>=13.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["pipeline*"]
